# Example: multiple model configurations for a 16 GB M4 Mac mini.
# Copy entries into models.yaml after pulling the upstream tags with ollama.

listen: "0.0.0.0:4000"
ollama_base: "http://127.0.0.1:11434"
active: chat
context_length: 32768

models:
  tiny:
    upstream: "smollm2:135m"

  # Best balance on M4 16GB (~7GB) — summarization + reasoning
  chat:
    upstream: "qwen3.5:9b"

  # Echo briefing cards. Create once: ollama create echo -f modelfiles/echo.Modelfile
  echo:
    upstream: "echo"
    num_ctx: 8192
    num_predict: 900

  summarize:
    upstream: "summarize"

  # Coding (already on this machine if pulled earlier)
  # code:
  #   upstream: "qwen2.5-coder:7b"
